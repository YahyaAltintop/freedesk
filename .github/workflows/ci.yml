name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only: CI only builds and tests. Actions are pinned by commit SHA; a
# floating tag would let a compromised action run with whatever this token has.
permissions:
  contents: read

jobs:
  host-agent:
    name: Host agent (Go, Windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: host-agent
    env:
      # The agent links libvpx in through cgo, built with MSYS2's UCRT64 gcc
      # (scripts/build-libvpx.sh). The runner has another gcc on PATH; the CC
      # and PATH entries set after the MSYS2 install make sure this one is used.
      CGO_ENABLED: "1"
    steps:
      # The Windows runner converts text files to CRLF on checkout, and gofmt
      # reports every CRLF file as unformatted. .gitattributes pins Go files
      # to LF; this keeps the rest of the tree byte-identical as well. It runs
      # before checkout, so the job's default working directory does not exist
      # yet: use the workspace root explicitly.
      - run: git config --global core.autocrlf false
        working-directory: ${{ github.workspace }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: host-agent/go.mod
          cache-dependency-path: host-agent/go.sum
      # The C toolchain. The action installs its own MSYS2 (the installer is
      # pinned by the action's commit) and updates it, so packages come from
      # today's database; their versions follow MSYS2. libvpx is pinned by
      # commit.
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        id: msys2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-nasm
            make
            git
            diffutils
      - name: Use the UCRT64 gcc for cgo
        shell: pwsh
        run: |
          $bin = Join-Path '${{ steps.msys2.outputs.msys2-location }}' 'ucrt64\bin'
          Add-Content -Path $env:GITHUB_PATH -Value $bin
          Add-Content -Path $env:GITHUB_ENV -Value "CC=$(Join-Path $bin 'gcc.exe')"
      - name: Build libvpx (VP8 encoder, static)
        shell: msys2 {0}
        run: bash scripts/build-libvpx.sh
      - name: gofmt
        shell: bash
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then echo "gofmt needed:"; echo "$files"; exit 1; fi
      # The exe's icon, version information and manifest (cmd/host/winres):
      # a broken resource definition should fail here, not on the release.
      - run: go generate ./cmd/host
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      # Fails the build on a known vulnerability the agent's code actually
      # reaches, in the standard library or a module. The exe runs on every
      # host machine, so a fixed-but-unshipped CVE is a shipped CVE.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      # The release-style exe must need no DLL Windows does not ship, must
      # have the video encoder and must carry its license texts; a change that
      # breaks any of them fails here, not on a user's machine. As in the
      # release, the texts are written first, because the build embeds them;
      # a new dependency without a license file fails here, not on release.
      # (The steps above build and test without them, as a developer does.)
      - name: Check the release exe
        run: |
          go run ./cmd/notices -o internal/licenses/generated/LICENSES.txt
          if ($LASTEXITCODE -ne 0) { exit 1 }
          New-Item -ItemType Directory -Force ../ci-dist | Out-Null
          go build -trimpath -ldflags "-s -w -H=windowsgui" -o ../ci-dist/freedesk.exe ./cmd/host
          if ($LASTEXITCODE -ne 0) { exit 1 }
          go run ./cmd/importcheck -licenses internal/licenses/generated/LICENSES.txt ../ci-dist/freedesk.exe
          if ($LASTEXITCODE -ne 0) { exit 1 }

  frontend:
    name: Viewer (Vue)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run type-check
      - run: npm run lint
      - run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
          VITE_FIREBASE_DATABASE_URL: ${{ vars.FIREBASE_DATABASE_URL }}
          VITE_GITHUB_REPO: ${{ github.repository }}

  rules:
    name: Database rules (emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: host-agent/go.mod
          cache-dependency-path: host-agent/go.sum
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Run the rules + signaling E2E tests against the emulator
        working-directory: firebase
        run: |
          npx --yes firebase-tools@latest emulators:exec --only "auth,database" --project demo-rcapp \
            "cd ../host-agent && go test ./internal/firebase/ ./internal/webrtc/ -run Emulator -v -count=1"
