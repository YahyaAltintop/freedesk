name: Deploy web

# Publishes the viewer to Firebase Hosting on every push to main that touches
# it (or manually from the Actions tab). The database rules are NOT deployed
# here: deploy them once by hand (`firebase deploy --only database` in
# firebase/) and again whenever database.rules.json changes.
#
# Required repository VARIABLES: FIREBASE_API_KEY, FIREBASE_AUTH_DOMAIN,
#   FIREBASE_PROJECT_ID, FIREBASE_APP_ID, FIREBASE_DATABASE_URL
# Required repository SECRET: FIREBASE_SERVICE_ACCOUNT — the JSON key of a
#   service account with the "Firebase Hosting Admin" role (Firebase console →
#   Project settings → Service accounts → Generate new private key). It is used
#   ONLY here, by CI, never shipped anywhere.

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "firebase/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build viewer
        working-directory: frontend
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
          VITE_FIREBASE_DATABASE_URL: ${{ vars.FIREBASE_DATABASE_URL }}
          # The home page's Download button links to this repository's Releases.
          VITE_GITHUB_REPO: ${{ github.repository }}
        run: |
          npm ci
          npm run build

      - name: Deploy hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
          channelId: live
          entryPoint: firebase
